version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    # Majors of the lint and telemetry families arrive grouped and held for 30 days (CFP-20 to CFP-22). Dependabot puts
    # an update in the first group that matches it, so these groups come before dev-tooling.
    cooldown:
      semver-major-days: 30
      include: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint', '@opentelemetry/*']
    groups:
      # playwright-bdd reaches into Playwright internals: they only move together, and only to a pair
      # playwright-bdd's changelog lists as supported (ADR 023).
      playwright:
        patterns: ['@playwright/test', 'playwright', 'playwright-bdd']
      eslint-majors:
        patterns: ['eslint', 'eslint-*', '@eslint/*', 'typescript-eslint']
        update-types: [major]
      opentelemetry-majors:
        patterns: ['@opentelemetry/*']
        update-types: [major]
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['@playwright/test', 'playwright', 'playwright-bdd']
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  # Add the cargo ecosystem (directory /apps/agent/src-tauri) when the agent skeleton lands (F0 agent-skeleton).
