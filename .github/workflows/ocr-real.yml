name: ocr-real

# The Windows OCR check on the maintainer's real screenshots (apps/agent/ocr-lab/README.md). The screenshots are one
# AES-256 encrypted zip in the repository; the password is the secret OCR_PRINTS_PASSWORD, reachable only on the extract
# step, and never for a fork's pull request. The extracted folder is deleted at the end and never uploaded.
# The job's PASS or FAIL is the exit code of ocr-check.exe; the drawn-fixture tests after it are informational.
on:
  pull_request:
    paths:
      - 'apps/agent/**'
      - 'scripts/agent/**'
      - '.github/workflows/ocr-real.yml'

permissions:
  contents: read

jobs:
  ocr-real:
    name: ocr-real
    # Fork pull requests never receive the secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: zip
        name: Is the encrypted zip in the repository?
        run: |
          if [ -f apps/agent/ocr-lab/real-prints.zip ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No apps/agent/ocr-lab/real-prints.zip yet; nothing to check."; fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.zip.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.zip.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the workspace
        if: steps.zip.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the UI (Tauri reads frontendDist)
        if: steps.zip.outputs.present == 'true'
        run: pnpm --filter @d2rmm/agent build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.zip.outputs.present == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.zip.outputs.present == 'true'
        with:
          workspaces: apps/agent/src-tauri
      - name: Build the OCR check
        if: steps.zip.outputs.present == 'true'
        working-directory: apps/agent/src-tauri
        run: cargo build --locked --release --example ocr-check
      - name: Extract the real screenshots
        if: steps.zip.outputs.present == 'true'
        env:
          PW: ${{ secrets.OCR_PRINTS_PASSWORD }}
        run: |
          "/c/Program Files/7-Zip/7z.exe" e -y -bso0 -bsp0 -p"$PW" -o"$RUNNER_TEMP/real-prints" apps/agent/ocr-lab/real-prints.zip
      - name: Read them with Windows OCR
        if: steps.zip.outputs.present == 'true'
        run: apps/agent/src-tauri/target/release/examples/ocr-check.exe "$RUNNER_TEMP/real-prints"
      # Informational (characters-reading T32): the real screenshots above are the Windows OCR proof. The tests read the
      # xtask-drawn fixtures, which the engine does not read like the game's lettering; they never fail this job.
      - name: Read the drawn fixtures with Windows OCR (informational)
        if: steps.zip.outputs.present == 'true'
        continue-on-error: true
        working-directory: apps/agent/src-tauri
        run: cargo test --locked --features drawn-fixtures-ocr -p d2rmm-agent --lib -- ocr_reads_the_drawn_character_fixtures ocr_reads_the_dimmed_popup_as_normal_only ocr_reads_the_drawn_full_screen_fixtures --nocapture
      - name: Delete the extracted screenshots
        if: always()
        run: rm -rf "$RUNNER_TEMP/real-prints"

  # The robustness measure (apps/agent/ocr-lab/README.md): hundreds of in-memory variations of each real screenshot, read with the
  # production reading and counted per transform family as correct, refused or wrong. 19 prints at 5 to 16 minutes each do not fit
  # one job's 120 minutes, so the prints are split over 8 shards (`ocr-check --variations --shard i/8`, round-robin over the sorted
  # list), one Windows job each, and the job `ocr-variations` merges the partial counts and holds the totals to the quality
  # ratchet. A print whose variations take more than 20 minutes (the per-print budget) fails its shard: slow reading code still
  # fails. No variation is written to disk; only the counts (ocr-variations.json) are uploaded.
  ocr-variations-shard:
    name: ocr-variations-shard (${{ matrix.shard }}/8)
    # Fork pull requests never receive the secret.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - id: zip
        name: Is the encrypted zip in the repository?
        run: |
          if [ -f apps/agent/ocr-lab/real-prints.zip ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No apps/agent/ocr-lab/real-prints.zip yet; nothing to measure."; fi
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        if: steps.zip.outputs.present == 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.zip.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install the workspace
        if: steps.zip.outputs.present == 'true'
        run: pnpm install --frozen-lockfile
      - name: Build the UI (Tauri reads frontendDist)
        if: steps.zip.outputs.present == 'true'
        run: pnpm --filter @d2rmm/agent build
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        if: steps.zip.outputs.present == 'true'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: steps.zip.outputs.present == 'true'
        with:
          workspaces: apps/agent/src-tauri
      - name: Build the OCR check
        if: steps.zip.outputs.present == 'true'
        working-directory: apps/agent/src-tauri
        run: cargo build --locked --release --example ocr-check
      - name: Extract the real screenshots
        if: steps.zip.outputs.present == 'true'
        env:
          PW: ${{ secrets.OCR_PRINTS_PASSWORD }}
        run: |
          "/c/Program Files/7-Zip/7z.exe" e -y -bso0 -bsp0 -p"$PW" -o"$RUNNER_TEMP/real-prints" apps/agent/ocr-lab/real-prints.zip
      - name: Read the variations with Windows OCR
        if: steps.zip.outputs.present == 'true'
        run: |
          apps/agent/src-tauri/target/release/examples/ocr-check.exe --variations --shard ${{ matrix.shard }}/8 --summary "$RUNNER_TEMP/ocr-variations.md" --json "$RUNNER_TEMP/ocr-variations.json" "$RUNNER_TEMP/real-prints"
      # The per-print budget: 20 minutes for the variations of one print (PRINT_BUDGET_MINUTES in the script).
      - name: Hold each print to the 20-minute budget
        if: steps.zip.outputs.present == 'true'
        run: |
          node scripts/agent/ocr-variations-shards.mjs budget --json "$RUNNER_TEMP/ocr-variations.json" --minutes 20
      - name: Add the counts to the job summary
        if: steps.zip.outputs.present == 'true' && always()
        run: |
          if [ -f "$RUNNER_TEMP/ocr-variations.md" ]; then cat "$RUNNER_TEMP/ocr-variations.md" >> "$GITHUB_STEP_SUMMARY"; fi
      # Only the counts file of the shard: never the extracted screenshots, never a variation.
      - name: Upload the counts
        if: steps.zip.outputs.present == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocr-variations-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ocr-variations.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Delete the extracted screenshots
        if: always()
        run: rm -rf "$RUNNER_TEMP/real-prints"

  # The required check. It merges the 8 partial counts into the file an unsharded run would have written and holds it to the
  # quality ratchet (context ocr, .quality-baseline.json): more wrong reads or fewer correct ones than the baseline fail the
  # job. It fails when a shard failed, was cancelled or uploaded nothing, and when a print is counted twice or not at all.
  # It never sees the secret or a screenshot, only the counts.
  ocr-variations:
    name: ocr-variations
    needs: ocr-variations-shard
    # Always runs for a same-repository pull request, so a failed shard fails this check instead of skipping it.
    if: ${{ always() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Every shard succeeded
        env:
          SHARDS: ${{ needs.ocr-variations-shard.result }}
        run: |
          if [ "$SHARDS" != "success" ]; then echo "The shards ended as '$SHARDS', not 'success'."; exit 1; fi
      - id: zip
        name: Is the encrypted zip in the repository?
        run: |
          if [ -f apps/agent/ocr-lab/real-prints.zip ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "No apps/agent/ocr-lab/real-prints.zip yet; nothing to measure."; fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.zip.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.zip.outputs.present == 'true'
        with:
          pattern: ocr-variations-shard-*
          path: ${{ runner.temp }}/shards
      - name: Merge the shards
        if: steps.zip.outputs.present == 'true'
        run: |
          mkdir -p reports
          node scripts/agent/ocr-variations-shards.mjs merge --dir "$RUNNER_TEMP/shards" --count 8 --out reports/ocr-variations.json
      # The supported totals of the merged run against the baseline; the other sources are absent here, which the collect tolerates.
      - name: Hold the variations to the quality ratchet
        if: steps.zip.outputs.present == 'true'
        run: |
          node scripts/quality-collect.mjs
          node scripts/quality-ratchet.mjs --context ocr
      # Only the merged counts file: never a screenshot, never a variation.
      - name: Upload the counts
        if: steps.zip.outputs.present == 'true' && always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ocr-variations
          path: reports/ocr-variations.json
          if-no-files-found: ignore
          retention-days: 14
