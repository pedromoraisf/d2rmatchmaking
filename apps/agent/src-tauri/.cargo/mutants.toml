# cargo-mutants scope of the agent (ADR 014, AGS-21, ADR 026; design.md § Mutation scope, AD-080). The nightly `agent-mutation`
# job and the Verifier run these modules against their unit tests only (`-- --lib`). Every module of the domain is in scope,
# and so are the rule modules of the application and of the adapters. `adapters/src/http/api_client.rs` is out of scope by the
# maintainer's decision (2026-11-02): its async I/O bodies cannot be proved by unit tests (ADR 026). The read-only boundary is proved by clippy and cargo-deny.
examine_globs = [
  "domain/src/**/*.rs",
  "core/src/pair.rs",
  "core/src/follow_stream.rs",
  "core/src/check_update.rs",
  "core/src/post_observation.rs",
  "core/src/beat.rs",
  "adapters/src/http/translate.rs",
  "adapters/src/http/sse.rs",
]

# Equivalent mutant, excluded by the maintainer's decision (2026-11-02): `core/src/pair.rs:87`, `delete ! in pair_once`.
# With `!` deleted, `pause` returning true ends `pair_once` with `Interrupted` and `run` re-enters it at once with a fresh
# `Pairing`, which equals the aggregate after the pause; with `!` kept, `pause` returning false loops once and
# `obtain_code` returns `None`, also `Interrupted`. No unit test can tell the two apart.
exclude_re = ["delete ! in pair_once"]
