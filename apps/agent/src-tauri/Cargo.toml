[workspace]
members = [".", "core", "xtask"]
exclude = ["boundary-fixtures"]
resolver = "3"

[package]
name = "d2rmm-agent"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "D2R Match Making desktop agent (Tauri 2 app shell)."

[dependencies]
d2rmm-agent-core = { path = "core" }
reqwest = { version = "0.13", features = ["json", "stream"] }
tauri = "2"
thiserror = "2"

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
