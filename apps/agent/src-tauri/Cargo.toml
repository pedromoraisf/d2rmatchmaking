[workspace]
members = [".", "core", "domain", "adapters", "xtask"]
# The root is a package, so cargo's default would check the app crate alone. Every member is a default member, so the agent
# job and the Windows check (`cargo clippy`, `cargo nextest run` without --workspace) cover every crate (AHM-21, AHM-22).
default-members = [".", "core", "domain", "adapters", "xtask"]
exclude = ["boundary-fixtures"]
resolver = "3"

[package]
name = "d2rmm-agent"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "D2R Match Making desktop agent (Tauri 2 app shell)."

[dependencies]
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
chrono = "0.4"
d2rmm-agent-adapters = { path = "adapters", version = "0.0.0" }
d2rmm-agent-core = { path = "core", version = "0.0.0" }
d2rmm-agent-domain = { path = "domain", version = "0.0.0" }
serde_json = "1"
tauri = "2"
tauri-plugin-updater = "2"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
# The ready-check hotkey (RDY-07): registers the key combination with the OS (RegisterHotKey), no keyboard hook, no input.
global-hotkey = "0.8"
keyring = { version = "3", features = ["windows-native"] }
windows = { version = "0.62", features = ["Foundation", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging"] }

[features]
# The F0 fixture-read trigger (AGS-33, AD-057). Never a default feature; release-agent.yml never enables it.
# The adapters crate has its own `fixture-read` (the headless example, AD-096, adapters/Cargo.toml); both stay off by default.
fixture-read = ["dep:image"]

[build-dependencies]
tauri-build = "2"

[dev-dependencies]
png = "0.18"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt"] }
