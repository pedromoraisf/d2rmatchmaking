[package]
name = "d2rmm-agent-core"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false
description = "D2R Match Making agent core: pairing, heartbeat, stream, vision and fusion. No Tauri dependency."

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["serde"] }
opentelemetry = "0.33"
opentelemetry_sdk = "0.33"
regress = "0.12"
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
tracing = "0.1"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = "0.3"
url = "2"
uuid = "1"
zeroize = "1"

[dev-dependencies]
axum = "0.8"
jsonschema = "0.60"
tokio = { version = "1", features = ["macros", "net", "rt", "rt-multi-thread", "test-util", "time"] }
tokio-stream = { version = "0.1", features = ["sync"] }
